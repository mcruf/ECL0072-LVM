### &lt;span style="color: #ee6c4d;"&gt;**Métodos de inferência** &lt;/span&gt;


#### Como estimamos (inferimos) as relações da natureza?

&lt;br&gt;

--

- 1) Definir o modelo que descreve o sistema em estudo (i.e., distribuição de probabilidade)
    - Função será utilizada para predições

--

&lt;br&gt;

- 2) Identificar possíveis valores para os parâmetros desconhecidos do modelo 

--

&lt;br&gt;

- 3) Avaliar a incerteza dos parâmetros estimados
    - Explorar a função em torno de valores de parâmetros plausíveis (espaço paramétrico; *parameter space*)

---
### &lt;span style="color: #ee6c4d;"&gt;**Métodos de inferência** &lt;/span&gt;

#### Como estimamos (inferimos) as relações da natureza?

&lt;br&gt;

    - Método dos momentos
    - &lt;span style="color: #ee6c4d;"&gt;Método dos mínimos quadrados&lt;/span&gt;
    - &lt;span style="color: #ee6c4d;"&gt;Método de máxima verossimilhança&lt;/span&gt;

`$$\large \text{SQR} = min \sum_{i=1}^{n} (y_i - f(x_i|\theta))^2$$`

{\text{Diferenciar a função em relação a }\ \theta}$$`

### &lt;span style="color: #ee6c4d;"&gt;**Métodos de inferência** &lt;/span&gt;&lt;span style="color: #3e5c76;"&gt;| Mínimos quadrados (OLS)  &lt;/span&gt; 

**Solução analítica:**

&lt;br&gt;

`$$\large \hat{\beta_0} = (X^TX)^{-1}X^Ty ~~\color{gray}{(= \overline{y} - \widehat{\beta_1}~\overline{x})}$$`
--

&lt;br&gt;

`$$\large \hat{\beta_1} = X(X^TX)^{-1}X^Ty ~~\color{gray}{(= r \frac{\sigma_y}{\sigma_x})}$$`






.footnote[**r** = coeficiente de correlação;  **σ** = desvio padrão]

`$$\large L(\theta \mid y_1, \dots, y_n) = f(y_1 \mid \theta) \cdot f(y_2 \mid \theta) \cdot f(y_3 \mid \theta) \cdots f(y_n \mid \theta)$$`
&lt;br&gt;

--


**Quando** `\(\bf{n &gt;&gt;}\)`
- limitação computacional
    - truque matemático: aplicar o log!
    

---
### &lt;span style="color: #ee6c4d;"&gt;**Métodos de inferência** &lt;/span&gt;&lt;span style="color: #3e5c76;"&gt;| Máxima verossimilhança  &lt;/span&gt; 


#### Traduzindo para o matematiquês

&lt;br&gt;

`$$\large L(\theta \mid y_1, \dots, y_n) = \prod_{i=1}^{n} f(y_i \mid \theta)$$`

--

Função de log-verossimilhança (*log-likelihood*)

`$$\large \log L(\theta\mid y_1,\dots,y_n)
=\sum_{i=1}^n \log f(y_i\mid \theta)$$`

--

- Tornando o produto em somatório implica em:
    - Estabilidade numérica e maior facilidade na diferenciação da função
    - O máximo da função torna-se o mínimo, i.e., `\(\hat{\theta} := argmin ~ L(\theta)\)`


---
### &lt;span style="color: #ee6c4d;"&gt;**Métodos de inferência** &lt;/span&gt;&lt;span style="color: #3e5c76;"&gt;| Máxima verossimilhança  &lt;/span&gt;

#### **Exemplo prático**

Lembrando que a função de verossimilhança `\(L(\cdot)\)` é descrita em relação ao modelo probabilístico que descreve a variável `\(f(Y|\theta)\)`

`$$\large L(\theta \mid y_1, \dots, y_n) = \prod_{i=1}^{n} \color{Tomato}{f(y_i \mid \theta)}$$`

\exp\left[ -\frac{(y_i - \mu)^2}{2\sigma^2} \right]}$$`

### &lt;span style="color: #ee6c4d;"&gt;**Diagnóstico de modelos** &lt;/span&gt;


Tem por objetivo avaliar os pressupostos e a qualidade do ajuste do modelo
- o quão bem o modelo se ajustou aos dados

--

&lt;br&gt;

Realizado mediante a análise residual

.pull-left[
- LM `\(\neq\)` GLM

- No caso de LM:
  - Independência
  - Homocedasticidade
  - Normalidade
]

--

.pull-right[

**Métodos de diagnóstico**

- Numérico (validação estatística)
- Gráfico (validação visual)

]

---
### &lt;span style="color: #ee6c4d;"&gt;**Diagnóstico de modelos** &lt;/span&gt;&lt;span style="color: #3e5c76;"&gt;| Homocedasticidade&lt;/span&gt;

&lt;br&gt;

`$$\Large \epsilon \overset{\mathrm{iid}}{\sim} N(0,\sigma^2)$$`

&lt;br&gt;

A violação da independência ocorre frequentemente por dados com estrutura:

&gt; &lt;font size="6"&gt;&lt;center&gt; &lt;span style="color: #ee6c4d;"&gt;Essentially, &lt;b&gt;all models are wrong&lt;/b&gt;, but &lt;b&gt;some are useful&lt;/b&gt;&lt;/center&gt;&lt;/font&gt;&lt;/span&gt; 

]

---

### &lt;span style="color: #ee6c4d;"&gt;**Seleção de modelos** &lt;/span&gt;

Baseado no *princípio da parcimônia*
  - Modelo mais simples com maior poder explicativo

--

&lt;br&gt;

Existem diversas métricas que podem ser utilizadas para comparar diferentes modelos:

- Deviance
- Teste da razão de verossimilhança (LRT)
- Critérios de informação (AIC, BIC)
- Ajuste gráfico


---

### &lt;span style="color: #ee6c4d;"&gt;**Seleção de modelos** &lt;/span&gt;&lt;span style="color: #3e5c76;"&gt;| Deviance  &lt;/span&gt;


Generalização da soma dos quadrados dos resíduos (RSS):

&lt;br&gt;

`$$\large D = 2 \times (logL_{saturado}- logL_{proposto})$$`
- `\(logL_{saturado}\)`: log-verossimilhança modelo saturado (ajuste perfeito)
- `\(logL_{proposto}\)`: log-verossimilhança modelo proposto

&lt;br&gt;

--

&gt; &lt;span style="color: #ee6c4d;"&gt;**Interpretação:** quanto menor a deviance, mais próximo o modelo está do ajuste perfeito&lt;/p&gt;

&lt;br&gt;


---

### &lt;span style="color: #ee6c4d;"&gt;**Seleção de modelos** &lt;/span&gt;&lt;span style="color: #3e5c76;"&gt;| Teste da razão de verossimilhança  &lt;/span&gt;


Usado para comparar modelos aninhados

- `\(\text{modelo A:}~~~ \large y_i = \beta_0 + \beta_1x_{i_1}\)`

- `\(\text{modelo B:}~~~ \large y_i = \beta_0 + \beta_1x_{i_1} + \beta_2x_{i_2}\)`


--


Baseado na estatística do teste da razão de verossimilhança:

.pull-left[
`$$G^2 = 2 \times log\Biggl(\frac{L_B}{L_A}\Biggr)$$`
`$$G^2 = \underbrace{2 \times (logL_A - logL_B)}_\text{Deviance}$$`

]
.pull-right[

- `\(G^2\)` segue uma distribuição do qui-quadrado (`\(\chi^2\)`) com n = (`\(n_{p_A} - n_{p_B}\)`) graus de liberdade

]

--

&gt; &lt;span style="color: #ee6c4d;"&gt;**Interpretação:** se p &lt; 0.05 rejeita-se a hipótese nula (modelo mais simples); modelo mais complexo se ajusta melhor aos dados!&lt;/p&gt;


---

### &lt;span style="color: #ee6c4d;"&gt;**Seleção de modelos** &lt;/span&gt;&lt;span style="color: #3e5c76;"&gt;| Critérios de informação  &lt;/span&gt;


Avalia não apenas o ajuste do modelo, como também a sua complexidade
  - penalização pelo número de parâmetros


--

.pull-left[

**AIC (Akaike Information Criterion)**

&lt;br&gt;

`$$\large AIC = -2log(L_{modelo}) + 2k$$`
`\(k:\)` número de parâmetros


&gt;   &lt;span style="color: #ee6c4d;"&gt;**Interpretação:** quanto menor AIC, melhor o ajuste&lt;/p&gt;

]

--

.pull-right[

**BIC (Bayesian Information Criterion)**

&lt;br&gt;

`$$\large BIC = -2log(L_{modelo}) + k~ log(n)$$`
`\(n:\)` número de observações


&gt;  &lt;span style="color: #ee6c4d;"&gt;**Interpretação:** quanto menor BIC, melhor o ajuste&lt;/p&gt;

]

---
