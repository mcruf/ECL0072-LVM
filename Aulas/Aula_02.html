# PPGECO | ECL0072 | out. 2026

### O método científico  | .small-text[&lt;span style="color: #e07a5f;"&gt;Teste de hipótese (nula)&lt;/span&gt;]

O teste de hipótese parte do pressuposto de que a hipótese nula (`\(H_0\)`) é *verdadeira*

Se H₀ fosse verdadeira, qual seria a probabilidade de obter um valor igual ou maior que 1.7 (p-valor).



- rejeita h0 ou deixa de rejeitar h0

---

Depois que apresentar p-valor/nivel de significancia, apresentar o intervalo de confianca (diretamente ligado ao nivel de significancia - alpha =5% -&gt; IC = 95%)

---
O objetivo da inferência estatística reside em confrotar a hipótese sob investigação com a hipótese nula
- Null-hypothesis test (NHTS)
  - Método hipotético-dedutivo

- According to Popper, theories/models/hypotheses can only be rejected (falsified),because the only save path of knowledge is deduction


*Reductio ad absurdum* - é o que é a hipótese nula. argumento de redução ao absurdo
- The NHST is a version of classica 'reductio ad absurdum' argument, which attempts to demonstrate that a statement is false by showing that an abusrd result follows from its acceptance 
OBS: NHST is often identified with the falsificationist, or Popperian, philosophy of science. however, usually NHST is used to falisfy a null hypothesis, not the actual research hypothesis. So the falsification is being done to something other than the explanatory model. This seems the reverse from Karl Popper's philosophy.

- As Sir. Ronald Fisher, put it: the only populations that can be referred to in a test of significance have no objective reality, being exclusively the product of the statistician's imagination
  - Ideia conectada com a questão: This leads to frequentist uncertainty being premised on imaginary resampling of data—if we were to repeat the measurement many many times, we would end up collecting a list of values that will have some pattern to it. It means also that parameters and models cannot have probability distributions, only measurements can. The distribution of these measurements is called a sampling distribution. This resampling is never done, and in general it doesn’t even make sense—it is absurd to consider repeat sampling of the diversification of song birds in the Andes. 



---


&lt;img src="../Figuras/Frequentist_workflow.png" alt="" width="85%" style="display: block; margin: auto;" /&gt;



---

Priors can have different levels of informativeness; the infomration reflected in a prior distribution can be anywhere on a continuum from complete uncertainty to relative certainty. Although priors can fall anywhere along this continuum, there are three main classifications of priors that are used in the literature to categorize the degree of (un)certainty surroudning the population parameter value
- informative
- weakly informative
- diffuse

- Bayesian workflow - https://arxiv.org/pdf/2011.01808 (Gelman - 2020)
