A identificação de padrões espaciais também depende fortemente da forma como os dados são coletados, i.e., *desenho amostral*


.pull-left[

&lt;br&gt;

.small-text[

**Extensão (*extent*)**

- Área total coberta pelo estudo
- Deve ser suficientemente grande para abranger o processo ecológico de interesse

  ]
  
----

.small-text[

**Resolução espacial (*grain*)**
- Tamanho da unidade amostral (quadrante, parcela, pixel, transecto, etc.)
- Determina o nível de detalhe observado

]

----

.small-text[
**Intervalo amostral**
- Distância entre unidades amostrais (espacial ou temporal)
- Determina as menores escalas espaciais (ou temporais) que podem ser detectadas

]

  
  
]

# PPGECO | ECL0072 | out. 2026

### Autocorrelação espacial | .small-text[&lt;span style="color: #e07a5f;"&gt;Correlograma&lt;/span&gt;]


Um correlograma espacial é um gráfico que descreve como a correlação entre observações varia em função da distância (e, eventualmente, da direção) que as separa

&lt;br&gt;

  - Pode ser calculado para um dado univariado
    - **Índice de Moran I**
    - Índice de Geary C

&lt;br&gt;

  - Também pode ser calculado para dados multivariados
    - Mantel 

--

&lt;br&gt;

&gt; &lt;span style="color: #e07a5f;"&gt;Permite identificar a estrutura, intensidade e escala da autocorrelação espacial presente nos dados&lt;/span&gt;


---
# PPGECO | ECL0072 | out. 2026

### Autocorrelação espacial | .small-text[&lt;span style="color: #e07a5f;"&gt;Correlograma&lt;/span&gt;]

#### Global Moran's I

Avalia se locais próximos tendem a apresentar valores semelhantes (ou diferentes) em relação ao que seria esperado ao acaso
- Quantifica o grau de autocorrelação espacial de uma variável

&lt;br&gt;

.gray-box-small[
`$$\large I = \frac{n \sum\limits_{i=1}^{n} \sum\limits_{j=1}^{n} w_{ij}(Y_i - \bar Y)(Y_j - \bar Y)}
{(\sum_{i \neq j} w_{ij}) \sum_i (Y_i - \bar Y)^2}$$`
]

.small-text[
onde:
- `\(n\)`: número de pontos (i.e., amostras)
- `\(Y_i, Y_j\)`: valor da variável resposta nos pares de ponto `\(i\)` e `\(j\)`
- `\(\bar Y\)`: média da variável resposta
- `\(w_{i,j}\)`: pesos que quantificam a proximidade espacial entre os pontos `\(i\)` e `\(j\)` 
  - `\(i,j = 1, ...n\)`
  - `\(w_{i,i} = 0\)`

]

# PPGECO | ECL0072 | out. 2026

### Autocorrelação espacial | .small-text[&lt;span style="color: #e07a5f;"&gt;Correlograma&lt;/span&gt;]

#### Global Moran's I

Avalia se locais próximos tendem a apresentar valores semelhantes (ou diferentes) em relação ao que seria esperado ao acaso
- Quantifica o grau de autocorrelação espacial de uma variável

&lt;br&gt;


.pull-left[

&lt;img src="../Figuras/spatial_autocorrelation_MoranI.png" alt="" width="100%" style="display: block; margin: auto 0 auto auto;" /&gt;

]


.pull-right[

&lt;br&gt;


Normalmente, `\(-1 &lt; \text{Moran's I} &lt; +1\)` 

- .small-text[**Autocorrelação positiva:**] `\(\small I &gt; 0\)`
- .small-text[**Autocorrelação negativa:**] `\(\small I &lt; 0\)`
- .small-text[**Sem autocorrelação:**] `\(\small I = 0\)`

]

# PPGECO | ECL0072 | out. 2026

### Autocorrelação espacial | .small-text[&lt;span style="color: #e07a5f;"&gt;Correlograma&lt;/span&gt;]

#### Local Moran's I


Representa a decomposição global do Moran's I para cada ponto amostral
- Também conhecido por *Local Indicators of Spatial Association* (LISA)
- Permite mapear aonde a autocorrelação espacial está concentrada
    - Identificar *hotspots* e *coldspots*



&lt;br&gt;

.gray-box-small[
`$$\large I_i = \frac{n (Y_i - \bar Y)}{\sum (Y_j - \bar Y)^2} \sum\limits_{j=1}^{n} w_{ij}(Y_j - \bar Y).$$`
]

# PPGECO | ECL0072 | out. 2026

### Autocorrelação espacial | .small-text[&lt;span style="color: #e07a5f;"&gt;Variograma&lt;/span&gt;]


O variograma é uma função que descreve como a diferença entre observações aumenta com a distância espacial
.small-text2[  
- **Correlograma:** mede a *similaridade* entre observações vizinhas
- **Variograma:** mede a *dissimilaridade* entre observações vizinhas
]


.pull-left[

&lt;br&gt;

.gray-box-small[ 
`$$\gamma(h) = \frac{1}{2N(h)} \sum\limits_{i=1}^{N(h)} (y_i-y_{i+h})^2$$`
]
&lt;br&gt;

.small-text[
onde:
- `\(h\)`: distância entre os pares de ponto `\((i, ~ i+h)\)` (*lag*)
- `\(N(h)\)`: número de pares de pontos separados pela distância `\(h\)`
- `\(\gamma(h)\)`: variância descrita em função da distância
]

]

.pull-right[


&lt;img src="../Figuras/variogram.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;

.center[&lt;span style="font-size: 50%;"&gt;**Modelo esférico**&lt;/span&gt;]



`$$\scriptsize \gamma(h) = 
\begin{cases} 
C_0 + C \left[ \frac{3}{2}\left(\frac{h}{a}\right) - \frac{1}{2}\left(\frac{h}{a}\right)^3 \right], &amp; \text{se } h \le a \\ 
C_0 + C, &amp; \text{se } h &gt; a 
\end{cases}$$`


]

### Estatística espacial 


Dados espaciais são definidos por um *processo estocástico* que é indexado pelo espaço `\((s)\)`, sendo descrito por dois componentes:

.pull-left[

&lt;br&gt;

.small-text2[
.center[**Domínio**:]

Representa a extensão espacial aonde os dados foram coletados (`\(\mathcal{D}^1\)`)

]

&lt;div style="height: 7px;"&gt;&lt;/div&gt;


-------

&lt;div style="height: 7px;"&gt;&lt;/div&gt;



.small-text2[
.center[**Variável aleatória**:]

Vetor representando a variável resposta coletada em `\(n\)` locais em `\(s\)`, conforme `\({Y(s_1), Y(s_2), \ldots, Y(s_n)}\)`  
  
  
  ]
    
]


.pull-right[


&lt;img src="../Figuras/grf2.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;

]

&lt;br&gt;

.footnote[.small-text2[&lt;sup&gt;1&lt;/sup&gt; Campo espacial/latente (*spatial*/*latent field*)]]


--

.small-text2[Diz-se, portanto, que as observações são uma *realização parcial* do campo aleatório, tal que]
`$$\{ ~Y(s) : s \in \mathcal{D} \subseteq \mathbb{R}^d~\}$$`

----

# PPGECO | ECL0072 | out. 2026

### Estatística espacial 

Modelos espaciais são extensões de modelos mistos

&lt;br&gt;

--

`$$\large y(s_i) \sim  F(\mu(s_i),  \phi)$$`
--

`$$\large g(\mu(s_i)) = 
 \eta(s_i) =  X(s_i)\beta + W(s_i) + \varepsilon(s_i)$$`

--

`$$W(s_i) \sim GRF(0, \Sigma)$$`

`$$\varepsilon(s_i) \sim N(0, \sigma^2)$$`

&lt;br&gt;

.small-text2[
onde:
- `\(s_i:\)` localização da *i*-ésima observação
- `\(\mathbf{X}(s_i)\boldsymbol{\beta}:\)` efeitos fixos (componente determinístico)
- `\(W(s):\)` efeito espacial aleatório (campo aleatório espacial; *Gaussian Random Field*, GRF)
- `\(\varepsilon(s):\)` erro residual *iid* (efeito pepita; *nugget effect*)

]


---
# PPGECO | ECL0072 | out. 2026

### Estatística espacial 

A principal diferença entre um modelo misto 'clássico' e um modelo espacial reside na construção da matriz de variância-covariância (`\(\boldsymbol{\Sigma}\)`)

&lt;div style="height: 7px;"&gt;&lt;/div&gt;


.pull-left[


.center[**Modelo Misto (intercepto aleatório)**]

&lt;div style="height: 7px;"&gt;&lt;/div&gt;


.center[

&lt;div style="height: 7px;"&gt;&lt;/div&gt;

.gray-box-small[

`$$\eta(s_i) = \mathbf{X}(s_i)\boldsymbol{\beta} + \color{#e07a5f}{\mathbf{Z}b} + \varepsilon(s_i)$$`

`$$b \sim MVN(0, \mathbf{\Sigma}_a)$$`

`$$\mathbf{\Sigma}_a = \sigma_a^2 \mathbf{I}$$`

]

]

&lt;div style="height: 4px;"&gt;&lt;/div&gt;

-----


.small-text[Observações do mesmo grupo estão correlacionados entre si pela relação ]

`$$\scriptsize \text{Cor}(y\_{ij}, y\_{kj}) = \frac{\sigma_a^2}{\sigma_a^2 + \sigma^2}$$`
.small-text[Como a correlação é *induzida*, diz-se que o **efeito aleatório é não estruturado**]

]



--


.pull-right[


.center[**Modelo Espacial**]

&lt;div style="height: 7px;"&gt;&lt;/div&gt;


.center[

&lt;div style="height: 7px;"&gt;&lt;/div&gt;

.gray-box-small[



`$$\eta(s_i) = \mathbf{X}(s_i)\boldsymbol{\beta} + \color{#e07a5f}{W(s_i)} + \varepsilon(s_i)$$`

`$$W(s) \sim \text{GRF}(0, \mathbf{\Sigma}_w)$$`

`$$\mathbf{\Sigma}_{w} = C(h_{ij})$$`
  ]
]


&lt;div style="height: 4px;"&gt;&lt;/div&gt;

-----


.small-text[A correlação entre observações é uma função da distância euclidiana, conforme relação]  

`$$\scriptsize C(h_{ij}) = \Vert s_i - s_j\Vert$$`


.small-text[Como a correlação é explicitamente definida, diz-se que o **efeito aleatório é estruturado**]

]

#### Dados vetoriais

.small-text2[

Representam dados cuja informação está armazenada em formas geométricas
- **Pontos**: representam pares de coordenadas (x,y)
- **Linhas**: definidas por dois ou mais pontos conectados
- **Polígono**: constituídos por múltiplos pontos conectados por linhas e que formam uma figura fechada

.small-text2[

  - `.dbf:` contém os atributos (informações) associados aos dados
  - `.shx:` índice espacial associada a geometria 
  - `.prj:` contém informação sobre a projeção e sistema de coordenadas

.small-text[

- **Longitude:** mede os ângulos a oeste ou leste do meridiano principal (greenwhich) 
  - Varia de -180&lt;sup&gt;∘&lt;/sup&gt; (oeste) a 180&lt;sup&gt;∘&lt;/sup&gt; (leste)

#### CRS 

Na prática, a maioria dos CRS podem ser especificados de acordo com o código **EPGS**&lt;sup&gt;1&lt;/sup&gt; ou *Proj4* (desuso)

- EPSG é um identificador numérico único que representa o CRS, incluindo o datum, o sistema de coordenadas e, quando aplicável, a projeção cartográfica

  - Exemplos:
    - EPSG 4326 (WGS 84)
    - EPSG 4674 (SIRGAS 2000)
    - [Outros exemplos](https://spatialreference.org/ref/?search=wgs84)


.footnote[&lt;sup&gt;1&lt;/sup&gt;*European Petroleum Survey Group*]
